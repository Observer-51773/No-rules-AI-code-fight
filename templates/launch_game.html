<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Launch Game — AI Arena</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Шапка сайта -->
    <header class="site-header">
        <pre class="mini-logo">
  /\_/\
 ( o.o )
  > ^ <
        </pre>
        <div class="topbar-title">ASCII Platform — Game Launcher</div>
        <nav class="nav-links">
            <a class="btn" href="{{ url_for('index') }}">Home</a>
        </nav>
    </header>

    <!-- Основная панель -->
    <div class="panel center" style="text-align: center; max-width: 600px; margin: 40px auto;">
        <pre id="launch-ascii" class="animated-ascii mini-logo" style="margin-bottom: 20px; font-size: 7px;"></pre>
        <h2 style="color: var(--neon-cyan); margin-bottom: 15px;">Launch Local Game</h2>
        <p style="margin-bottom: 25px; color: var(--text-main);">Click Start Game to request the server to start ai_arena.py locally (only on the server where Flask runs).</p>
        
        <div class="form-actions" style="display: flex; justify-content: center; gap: 15px;">
          <button id="launch-btn" class="btn">Start Game</button>
          <a class="btn" href="{{ url_for('index') }}" style="border-color: var(--border-color);">Back</a>
        </div>
        
        <div id="launch-result" class="msg" style="margin-top: 20px;"></div>
    </div>

<script>
const frames = [
`  .-----------------.
  |  LAUNCHING GAME  |
  |   ASCII STAGE     |
  '-----------------'`,
`  .-----------------.
  |   INVOKING PY    |
  |   PROCESS...     |
  '-----------------'`,
`  .-----------------.
  |   GOOD LUCK :)   |
  |  WATCH THE TERM  |
  '-----------------'`
];
let idx = 0;
const el = document.getElementById('launch-ascii');
function update(){ el.textContent = frames[idx]; idx = (idx + 1) % frames.length; }
setInterval(update, 380);
update();

document.getElementById('launch-btn').addEventListener('click', async () => {
  const resEl = document.getElementById('launch-result');
  resEl.textContent = 'Starting...';
  resEl.className = 'msg';
  try {
    const r = await fetch('/open-game', {method:'POST'});
    const j = await r.json();
    resEl.textContent = j.msg || (j.ok ? 'Started' : 'Failed');
    resEl.className = j.ok ? 'msg ok' : 'msg error';
  } catch(e) {
    resEl.textContent = 'Error: ' + e.toString();
    resEl.className = 'msg error';
  }
});
</script>
</body>
</html>
